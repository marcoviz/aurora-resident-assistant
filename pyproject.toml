[project]
name = "aurora-resident-assistant"
version = "1.0.0"
description = "Assistente condominial ADK com confirmacao e isolamento em codigo"
requires-python = ">=3.12"
dependencies = [
  "google-adk[db]==2.9.1",
  "sqlalchemy[asyncio]==2.1.5",
  "fastapi==0.141.1",
  "uvicorn==0.35.0",
  "python-dotenv==1.1.1",
]

[dependency-groups]
dev = ["httpx==0.28.1"]

[project.scripts]
aurora-api = "aurora.cli:serve"
aurora-reset = "aurora.cli:reset"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aurora"]
